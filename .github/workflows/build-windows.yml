name: Build Windows App

on:
  push:
    branches: [build-exe]
  workflow_dispatch:

jobs:
  build:
    name: Build artcraft-launcher.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build binary
        run: cargo build --release -p artcraft-launcher

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artcraft-launcher-windows
          path: target/release/artcraft-launcher.exe
